name: Windows Preview
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/windows-platform.test.ts'
      - 'package*.json'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/windows-platform.test.ts tests/card-windows.test.ts tests/ingestion-conformance.test.ts tests/codex-windows-pipe.test.ts tests/codex-open.test.ts
      - run: npm run package:win
      - name: Test the packaged executable with isolated synthetic data
        shell: pwsh
        run: |
          $preview = Get-ChildItem release -Recurse -Filter 'Agent Office.exe' | Select-Object -First 1
          if (-not $preview) { throw 'Packaged executable missing' }
          $env:AGENT_OFFICE_EXECUTABLE = $preview.FullName
          npm run test:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:desktop
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preview
          path: |
            release/
            .local/windows-*.png
          retention-days: 7
