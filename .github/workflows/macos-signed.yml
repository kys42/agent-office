name: macOS Signed Release

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac architecture
        required: true
        default: arm64
        type: choice
        options: [arm64, x64, both]
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: macos-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a committed main release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e "import fs from 'node:fs'; const tag=process.env.RELEASE_TAG; if(tag && tag !== 'v'+JSON.parse(fs.readFileSync('package.json')).version) throw new Error('Tag must match package version');"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:mcp
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          AGENT_OFFICE_DATA_DIR: ${{ runner.temp }}/agent-office-ui-data

  package:
    needs: verify
    environment: macos-release
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || inputs.architecture == 'both') && '[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]' || inputs.architecture == 'x64' && '[{"arch":"x64","runner":"macos-15-intel"}]' || '[{"arch":"arm64","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      AGENT_OFFICE_ARCH: ${{ matrix.arch }}
      AGENT_OFFICE_SIGNING: developer-id
      AGENT_OFFICE_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      AGENT_OFFICE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Import signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/ci-macos-keychain.sh
      - run: npm run package:dmg
      - name: Verify final installed signed app
        run: npm run test:package
      - name: Verify artifact checksums
        working-directory: release
        run: shasum -a 256 -c "SHA256SUMS-${AGENT_OFFICE_ARCH}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-office-signed-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.dmg
            release/*.json
            release/SHA256SUMS-*.txt
      - name: Preserve interrupted notarization for recovery
        if: failure()
        run: |
          if [ -d .local/notary ] && [ -d release ]; then
            tar -czf "$RUNNER_TEMP/agent-office-notary-recovery.tgz" .local/notary release
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: agent-office-notary-recovery-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/agent-office-notary-recovery.tgz
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/agent-office-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/agent-office-signing.p12" "$RUNNER_TEMP/agent-office-notary.p8"
      - name: Record release boundary
        run: |
          printf '%s\n' \
            '### Developer ID signed and notarized DMG' \
            'Final app and DMG tickets, Gatekeeper and installed app smoke passed.' \
            'Artifacts only. Public publishing and automatic updates are separate.' >> "$GITHUB_STEP_SUMMARY"
