name: macOS Signed Release

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac architecture
        required: true
        default: arm64
        type: choice
        options: [arm64, x64, both]

permissions:
  contents: read

concurrency:
  group: macos-signed-release
  cancel-in-progress: false

jobs:
  verify:
    # Environment approval is the credential boundary. These checks also reject other
    # dispatchers, re-run actors, forks and feature refs before spending runner time.
    if: >-
      github.repository == 'kys42/agent-office' &&
      github.actor_id == '25008566' && github.triggering_actor == 'kys42' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the requested main commit
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          printf '### Requested source\n`%s`\nApprove only this reviewed commit.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Runtime dependencies ship in the signed app. Dev-only tooling advisories (vite and
      # its globbing deps) never reach users, so they must not block a release.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:mcp
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          AGENT_OFFICE_DATA_DIR: ${{ runner.temp }}/agent-office-ui-data

  package:
    needs: verify
    if: >-
      github.repository == 'kys42/agent-office' &&
      github.actor_id == '25008566' && github.triggering_actor == 'kys42' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: macos-release
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'both' && '[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]' || inputs.architecture == 'x64' && '[{"arch":"x64","runner":"macos-15-intel"}]' || '[{"arch":"arm64","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      AGENT_OFFICE_ARCH: ${{ matrix.arch }}
      AGENT_OFFICE_SIGNING: developer-id
      AGENT_OFFICE_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      AGENT_OFFICE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Import signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/ci-macos-keychain.sh
      - run: npm run package:dmg
      - name: Verify final installed signed app
        run: npm run test:package
      - name: Verify artifact checksums
        working-directory: release
        run: shasum -a 256 -c "SHA256SUMS-${AGENT_OFFICE_ARCH}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-office-signed-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.dmg
            release/*.json
            release/SHA256SUMS-*.txt
      - name: Preserve interrupted notarization for recovery
        if: failure()
        run: |
          if [ -d .local/notary ] && [ -d release ]; then
            tar -czf "$RUNNER_TEMP/agent-office-notary-recovery.tgz" .local/notary release
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: agent-office-notary-recovery-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/agent-office-notary-recovery.tgz
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/agent-office-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/agent-office-signing.p12" "$RUNNER_TEMP/agent-office-notary.p8"
      - name: Record release boundary
        run: |
          printf '%s\n' \
            '### Developer ID signed and notarized DMG' \
            'Final app and DMG tickets, Gatekeeper and installed app smoke passed.' \
            'Artifacts only. Public publishing and automatic updates are separate.' >> "$GITHUB_STEP_SUMMARY"
