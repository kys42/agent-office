.actor{position:absolute;padding:0;margin:0;border:0;background:none;cursor:pointer}
.actor:focus-visible{outline:3px dashed #FFD166;outline-offset:2px}
.walker{animation:walk 5s steps(20) infinite}
.pb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% - 14px);background:#FFF8E7;color:#14173A;padding:6px 8px 7px;box-shadow:0 -3px 0 0 #0B0D22,0 3px 0 0 #0B0D22,-3px 0 0 0 #0B0D22,3px 0 0 0 #0B0D22,3px 6px 0 0 rgba(5,6,20,.45);white-space:nowrap;font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:12.5px;line-height:1;z-index:8}

.pix{box-shadow:0 -3px 0 0 #0B0D22,0 3px 0 0 #0B0D22,-3px 0 0 0 #0B0D22,3px 0 0 0 #0B0D22}
.cursor{position:absolute;left:50%;top:-18px;margin-left:-9px;width:18px;height:12px;animation:bob .5s steps(2) infinite;z-index:9}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:4px 10px 4px 6px;border:0;background:transparent;color:#F1EEFF;cursor:pointer;text-align:left;box-sizing:border-box}
.row.sel{background:#262B66}
.choice{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;background:transparent;color:#F1EEFF;cursor:pointer;font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:16px;text-align:left}
.choice:hover,.choice:focus-visible{background:#262B66;outline:none}
.blinkc{animation:blinkc 1s steps(1) infinite}
.neon{animation:neon 3s steps(1) infinite}
@keyframes frames{from{background-position-x:0}to{background-position-x:calc(-128px * var(--s))}}
@keyframes walk{0%{transform:translateX(-20px)}100%{transform:translateX(40px)}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blinkc{0%{opacity:1}50%{opacity:0}}

  { id: 's6', nick: '집사', title: '받은편지함 정리', sp: 'openclaw', repo: '개인 비서', st: 'work', short: '메일 7/12', hp: 77, desk: 112,
    text: '메일 12통 중 7통 분류했어요.\n중요한 2통은 따로 모아둘게요.', code: '', choices: ['요약 보기', '계속 부탁해!'] },

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: 's2', call: 'open', names: {}, naming: false, draft: '' };
  }
  renderVals() {
    const { selected, call, names, naming, draft } = this.state;
    const nickOf = (x) => (names[x.id] === undefined ? x.nick : names[x.id]);
    const nameOf = (x) => nickOf(x) || x.title;
    const sessions = SESSIONS.map((s) => {
      if (s.id !== 's2' || call === 'open') return s;
      return call === 'ok'
        ? Object.assign({}, s, { st: 'work', short: '빌드 중', text: '고마워요! 지우고 다시 빌드할게요.', code: '$ npm run build', choices: ['터미널 열기'] })
        : Object.assign({}, s, { st: 'idle', short: '…', text: '알겠어요. dist 는 두고 다른 방법을 찾아볼게요.', code: '', choices: ['터미널 열기'] });
    });
    const S = 3;
    const actors = sessions.map((s) => {
      let cx, top;
      if (s.desk) {
        cx = s.desk;
        top = s.st === 'work' || s.st === 'call' ? 300 - 30 * S : 300 - 26 * S;
      } else {
        cx = s.at.cx;
        top = s.at.foot - 30 * S;
      }
      const isSel = s.id === selected;
      const hpColor = s.hp < 25 ? '#FF5A5F' : s.hp < 50 ? '#FFD166' : '#5BE7C4';
      return {
        btnCls: 'actor' + (s.walk ? ' walker' : ''),
        pos: 'left:' + (cx - 16 * S) + 'px;top:' + top + 'px;width:' + 32 * S + 'px;height:' + 32 * S + 'px;z-index:2',
        sprCls: 'spr sp-' + s.sp + ' st-' + s.st,
        miniCls: 'spr s15 sp-' + s.sp + ' st-' + s.st,
        aria: s.repo + ' ' + STATE[s.st][0],
        short: s.short,
        showBubble: true,
        bubbleCls: 'pb' + (s.st === 'call' ? ' hot' : ''),
        sel: isSel,
        name: nameOf(s),
        agent: AGENT[s.sp],
        stateLabel: STATE[s.st][0],
        stateColor: 'color:' + STATE[s.st][1],
        hp: s.hp,
        hpBar: 'display:block;height:100%;width:' + s.hp + '%;background:' + hpColor,
        mark: isSel ? '▶' : '',
        rowCls: 'row' + (isSel ? ' sel' : ''),
        pick: () => this.setState({ selected: s.id, naming: false })
      };
    });
    const desks = sessions.filter((s) => s.desk).map((s) => ({
      tag: nameOf(s),
      desk: 'position:absolute;left:' + (s.desk - 66) + 'px;top:300px;width:132px;z-index:3',
      lamp: 'position:absolute;left:' + (s.desk + 40) + 'px;top:276px;width:20px;height:24px;z-index:3',
      cone: 'position:absolute;left:' + (s.desk - 70) + 'px;top:284px;width:150px;height:52px;background:rgba(255,209,102,.13);clip-path:polygon(70% 0,84% 0,100% 100%,0 100%)'
    }));
    const s = sessions.find((x) => x.id === selected) || sessions[0];
    const setNick = (v) => this.setState({ naming: false, names: Object.assign({}, names, { [s.id]: v }) });
    const acts = {
      '허용한다': () => this.setState({ call: 'ok' }),
      '거절한다': () => this.setState({ call: 'no' }),
      '이름 짓기': () => this.setState({ naming: true, draft: nickOf(s) || '' }),
      '이걸로 할래': () => setNick(this.state.draft.trim()),
      '제목 그대로': () => setNick(''),
      '취소': () => this.setState({ naming: false })
    };
    const labels = naming ? ['이걸로 할래', '제목 그대로', '취소'] : s.choices.concat(['이름 짓기']);
    const dlg = {
      portraitCls: 'spr s4 sp-' + s.sp + ' st-' + s.st,
      name: nameOf(s),
      title: s.title,
      agent: AGENT[s.sp] + ' · ' + STATE[s.st][0] + ' · ' + s.repo + (nickOf(s) ? ' · 「' + s.title + '」' : ''),
      text: s.text,
      code: s.code,
      hasCode: !!s.code,
      talking: !naming,
      naming,
      ask: KIND[s.sp] + '의 새 이름을 지어 주세요! 비우면 세션 제목으로 불러요.',
      draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      sugs: SUGS[s.sp].map((label) => ({ label, use: () => this.setState({ draft: label }) })),
      choices: labels.map((label, i) => ({
        label,
        markStyle: 'font-size:12px;color:#FFD166;opacity:' + (i === 0 ? 1 : 0),
        act: acts[label] || (() => {})
      }))
    };
    const count = (m) => sessions.filter((x) => x.st === m).length;
    return { actors, desks, dlg, countWork: count('work') + count('think'), countCall: count('call') };
  }
}
