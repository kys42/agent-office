  { id: 's7', no: '0405', nick: '', title: 'ETL v2 마이그레이션', sp: 'gemini', repo: 'data-pipeline', branch: 'etl-v2', mood: 'sleep', say: '25분째 조용', meta: '25분', start: '18:30 출근', steps: ['python etl.py', '완료 보고', '대기'] }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: 's1', call: 'open', names: {}, editing: false, draft: '' };
  }
  renderVals() {
    const { selected, call, names, editing, draft } = this.state;
    const nickOf = (x) => (names[x.id] === undefined ? x.nick : names[x.id]);
    const nameOf = (x) => nickOf(x) || x.title;
    const sessions = SESSIONS.map((s) => {
      if (s.id !== 's2' || call === 'open') return s;
      return call === 'ok' ? Object.assign({}, s, { mood: 'work', say: '다시 빌드 중', meta: '방금 허용' }) : Object.assign({}, s, { mood: 'idle', say: '다른 방법 찾는 중', meta: '방금 거절' });
    });
    let y = 96;
    const peeks = sessions.map((s) => {
      const isCall = s.mood === 'call';
      const size = isCall ? 104 : 86;
      const vis = isCall ? 100 : 54;
      const peekLeft = 1440 - vis;
      const top = y;
      y += isCall ? 176 : 96;
      const st = STATES[s.mood];
      const isSel = s.id === selected;
      return {
        id: s.id,
        tagCls: 'tag' + (isSel ? ' sel' : ''),
        tagPos: 'right:' + (vis + 14) + 'px;top:' + (top + (isCall ? 14 : 26)) + 'px' + (isCall ? ';font-size:15px;padding:12px 14px' : ''),
        peekCls: 'peek' + (isCall ? ' call' : ''),
        peekPos: 'left:' + peekLeft + 'px;top:' + top + 'px;width:' + size + 'px;height:' + size + 'px',
        aria: s.repo + ', ' + st.label,
        repo: s.repo,
        name: nameOf(s),
        say: s.say,
        lamp: 'background:' + st.lamp + ';box-shadow:0 0 0 2px ' + (isSel ? '#FBF8F1' : '#3255A4'),
        c: riso(s.sp, s.mood, isCall ? 'translate(-3 0)' : 'translate(-6 0)'),
        top,
        pick: () => this.setState({ selected: s.id, editing: false })
      };
    });
    const s = sessions.find((x) => x.id === selected);
    const p = peeks.find((x) => x.id === selected);
    let t = {};
    if (s && p) {
      const st = STATES[s.mood];
      const top = Math.max(110, Math.min(900 - 500, p.top - 40));
      t = {
        name: nameOf(s), title: s.title,
        subline: nickOf(s) ? '세션 제목 · ' + s.title : '세션 제목 그대로 · 이름표 없음',
        editing, viewing: !editing, draft,
        onDraft: (e) => this.setState({ draft: e.target.value }),
        edit: () => this.setState({ editing: true, draft: nickOf(s) || '' }),
        save: () => this.setState({ editing: false, names: Object.assign({}, names, { [s.id]: this.state.draft.trim() }) }),
        sugs: SPECIES[s.sp].sugs.map((label) => ({ label, use: () => this.setState({ draft: label }) })),
        no: s.no, repo: s.repo, agent: SPECIES[s.sp].agent, branch: s.branch, stateLabel: st.label, meta: s.meta, start: s.start, steps: s.steps,
        lamp: 'background:' + st.lamp + ';box-shadow:0 0 0 2px #3255A4',
        pos: 'position:absolute;left:' + (s.id === 's2' ? 640 : 770) + 'px;top:' + top + 'px;width:320px;background:#FBF8F1;border:2px solid #3255A4;box-shadow:8px 8px 0 rgba(255,72,176,.85)'
      };
    }
    return {
      peeks, t,
      hasSel: !!s,
      showCall: call === 'open',
      approve: () => this.setState({ call: 'ok' }),
      deny: () => this.setState({ call: 'no' }),
      pickCall: () => this.setState({ selected: 's2', editing: false })
    };
  }
}
</script>
